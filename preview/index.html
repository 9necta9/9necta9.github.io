<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NECTA</title>
<meta name="description" content="NECTA — Seoul-based electronic pop artist.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e85d6f">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e85d6f;
  --hot:#ff2d78;
  --ink:#111;
  --paper:#fffaf3;
  --seal:#c8322a;
  --serif:"Gowun Batang","Song Myung","Noto Serif KR",serif;
}

*,*::before,*::after{box-sizing:border-box}

body{
  margin:0;
  padding:32px 16px 46px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:var(--pink);
  background-image:linear-gradient(168deg,#f1576d 0%,#ea5a6c 46%,#e85d6f 100%);
  color:var(--ink);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
}

img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:#ffd9de}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}

/* ---------- the single card ---------- */

.card{
  position:relative;
  width:100%;
  max-width:382px;
  margin:0 auto;
  padding:18px 16px 20px;
  background:var(--paper);
  border:2px solid var(--ink);
  box-shadow:7px 7px 0 var(--ink);
  transform:rotate(-.55deg);
}

/* ---------- head: brush logotype + name seal ---------- */

.head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.logotype{
  flex:1 1 auto;
  min-width:0;
  margin:2px 0 0 -6px;
}
.logotype img{
  display:block;
  width:100%;
  height:auto;
  transform:rotate(-1.6deg);
}

.seal{
  flex:0 0 auto;
  margin-top:2px;
  padding:8px 7px;
  writing-mode:vertical-rl;
  text-orientation:upright;
  background:var(--seal);
  color:#fff4e6;
  border:2px solid var(--ink);
  border-radius:2px;
  font-family:var(--serif);
  font-weight:700;
  font-size:17px;
  line-height:1.1;
  letter-spacing:.08em;
  transform:rotate(3deg);
  box-shadow:2px 2px 0 rgba(17,17,17,.28);
}

/* ---------- location ---------- */

.loc{
  display:flex;
  align-items:center;
  gap:7px;
  margin:10px 0 0;
  font-family:var(--serif);
  font-weight:700;
  font-size:11px;
  line-height:1.2;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.loc svg{flex:0 0 auto;width:12px;height:12px}

/* ---------- photo ---------- */

.shot{
  margin:15px -3px 0;
  padding:5px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  transform:rotate(1deg);
}
.shot img{
  width:100%;
  height:auto;
  display:block;
  border:1px solid var(--ink);
}

/* ---------- links ---------- */

.links{
  display:grid;
  gap:7px;
  margin:18px 0 0;
}

.row{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:44px;
  padding:8px 9px;
  border:2px solid var(--ink);
  background:var(--paper);
  font-family:var(--serif);
  font-weight:700;
  font-size:13px;
  line-height:1.3;
  letter-spacing:.01em;
  transition:transform .07s,box-shadow .07s,background .07s,color .07s;
}
.row:hover,.row:active{
  background:var(--ink);
  color:var(--paper);
  transform:translate(-1px,-1px);
  box-shadow:2px 2px 0 rgba(17,17,17,.32);
}

.row--ep{
  background:var(--ink);
  color:var(--paper);
  font-size:14.5px;
}
.row--ep .badge{border-color:var(--paper)}
.row--ep .txt small{opacity:.72}
.row--ep:hover,.row--ep:active{background:var(--seal);color:#fff9f2}

.badge{
  flex:0 0 auto;
  display:grid;
  place-items:center;
  width:24px;
  height:24px;
  background:var(--hot);
  color:#fff;
  border:2px solid var(--ink);
  font-size:12px;
  line-height:1;
}

.row .txt{flex:1 1 auto;min-width:0}
.row .txt small{
  display:block;
  font-size:9.5px;
  font-weight:400;
  letter-spacing:.14em;
  text-transform:uppercase;
  opacity:.62;
  margin-top:1px;
}
.row .go{flex:0 0 auto;font-size:13px;line-height:1}

@media (max-width:400px){
  body{padding:24px 13px 42px}
  .card{box-shadow:5px 5px 0 var(--ink);padding:16px 14px 18px}
  .row--ep{font-size:13.5px}
}
</style>
</head>
<body>

  <main class="card">

    <div class="head">
      <h1 class="logotype"><img src="assets/logos/necta-logo.png?v=1" width="1200" height="598" alt="NECTA"></h1>
      <span class="seal" aria-label="넥타">넥타</span>
    </div>

    <p class="loc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.4"/><path d="M12 1.4v4.4M12 18.2v4.4M1.4 12h4.4M18.2 12h4.4"/></svg>
      <span>Seoul, South Korea</span>
    </p>

    <figure class="shot">
      <img src="assets/photos/necta-main-900.jpg?v=6"
           srcset="assets/photos/necta-main-900.jpg?v=6 900w, assets/photos/necta-main-1400.jpg?v=6 1400w"
           sizes="(max-width: 430px) calc(100vw - 50px), 346px"
           width="900" height="675"
           alt="NECTA, blunt fringe and patterned blouse, looking into the camera"
           fetchpriority="high">
    </figure>

    <nav class="links" aria-label="NECTA links">
      <a class="row row--ep" href="https://9necta9.github.io/" target="_blank" rel="noopener">
        <span class="badge" aria-hidden="true">★</span>
        <span class="txt">GOTTA FIX MY BANGS</span>
        <span class="go" aria-hidden="true">→</span>
      </a>

      <a class="row" href="https://linktr.ee/9necta9" target="_blank" rel="noopener">
        <span class="txt">Linktree<small>music &amp; streaming</small></span>
        <span class="go" aria-hidden="true">↗</span>
      </a>

      <a class="row" href="https://youtu.be/K1bzSSEGrGY" target="_blank" rel="noopener">
        <span class="txt">YouTube</span>
        <span class="go" aria-hidden="true">↗</span>
      </a>

      <a class="row" href="mailto:monnyu@naver.com">
        <span class="txt">monnyu@naver.com</span>
        <span class="go" aria-hidden="true">↗</span>
      </a>
    </nav>

  </main>

</body>
</html>
