<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NECTA</title>
<meta name="description" content="NECTA — Seoul-based electronic pop artist.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e85d6f">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e85d6f;
  --hot:#ff2d78;
  --ink:#0f0f10;
  --paper:#f4ecdf;
  --paper2:#fff8ee;
  --disp:"Archivo Black","Arial Black",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,"SFMono-Regular",monospace;
}

*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(110% 70% at 84% -6%, #f26e80 0%, rgba(242,110,128,0) 56%),
    radial-gradient(90% 60% at 6% 104%, #d8485c 0%, rgba(216,72,92,0) 60%),
    var(--pink);
  color:var(--ink);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--hot)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- press grain over the whole sheet ---------- */
.grain{
  position:fixed;
  inset:0;
  z-index:60;
  pointer-events:none;
  opacity:.55;
  mix-blend-mode:multiply;
  background-image:url("assets/grain.svg");
  background-size:200px 200px;
}
.grain::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:radial-gradient(rgba(15,15,16,.6) .65px, transparent .75px);
  background-size:4px 4px;
  opacity:.12;
}

/* ---------- the sheet ---------- */
.page{
  position:relative;
  width:100%;
  max-width:660px;
  margin:0 auto;
  padding:18px 20px 28px;
}

/* ---------- paper header ---------- */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  font:700 7.5px/1.35 var(--mono);
  letter-spacing:.2em;
  text-transform:uppercase;
}
.topbar span:first-child{transform:rotate(-1.4deg);transform-origin:0 0}
.topbar span:last-child{text-align:right;transform:rotate(2.2deg);transform-origin:100% 0}
.topbar b{font-size:12px;letter-spacing:.05em;display:block;line-height:1.1}

/* ---------- masthead ---------- */
.mast{
  position:relative;
  z-index:3;
  margin:10px 0 0;
}
.wordmark{
  width:100%;
  height:auto;
  transform:rotate(-2.8deg);
  transform-origin:50% 62%;
}

/* ---------- photo ---------- */
.shot{
  position:relative;
  z-index:1;
  width:calc(100% + 14px);
  margin:-13px 0 0 -10px;
  padding:7px 7px 18px;
  background:var(--paper2);
  border:1.5px solid var(--ink);
  box-shadow:7px 7px 0 var(--ink);
  transform:rotate(1.5deg);
}
.shot > img{
  width:100%;
  height:auto;
  border:1px solid rgba(15,15,16,.55);
  filter:saturate(1.04) contrast(1.02);
}
.shot figcaption{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin:7px 1px 0;
  font:400 7.5px/1.2 var(--mono);
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:.82;
}

/* black sticker over the photo's bottom-left corner */
.tab{
  position:absolute;
  z-index:4;
  left:5px;
  bottom:-14px;
  padding:7px 9px 6px;
  background:var(--ink);
  color:var(--paper);
  font:700 8px/1.15 var(--mono);
  letter-spacing:.14em;
  text-transform:uppercase;
  transform:rotate(-6deg);
  box-shadow:2px 2px 0 rgba(15,15,16,.3);
}
.tab i{display:block;font-style:normal;color:var(--hot);font-size:6.5px;letter-spacing:.22em;margin-top:2px}

/* vertical city stamp riding the photo's right edge */
.stamp{
  position:absolute;
  z-index:4;
  right:-2px;
  top:34%;
  display:flex;
  align-items:center;
  gap:5px;
  padding:9px 5px;
  background:var(--ink);
  color:var(--paper);
  writing-mode:vertical-rl;
  font:700 8px/1 var(--mono);
  letter-spacing:.28em;
  text-transform:uppercase;
  transform:rotate(1.6deg);
}
.stamp svg{width:9px;height:9px;flex:0 0 auto}

/* slanted rule that cuts the sheet */
.rule{
  position:relative;
  z-index:1;
  height:2px;
  width:88%;
  margin:22px 0 0 6%;
  background:var(--ink);
  transform:rotate(-4.4deg);
}
.cross{
  position:absolute;
  z-index:2;
  right:8%;
  margin-top:-9px;
  font:400 13px/1 var(--mono);
  opacity:.8;
}

/* ---------- links ---------- */
.links{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  margin:20px 0 0;
}
.ln{
  display:flex;
  align-items:center;
  min-height:48px;
  transition:transform .09s ease, box-shadow .09s ease, background .09s ease, color .09s ease;
}

/* 01 — big black sticker, crooked, wider than everything else */
.ln--ep{
  width:97%;
  margin-left:-4px;
  padding:11px 13px 12px;
  gap:11px;
  background:var(--ink);
  color:var(--paper2);
  transform:rotate(-3.1deg);
  box-shadow:5px 5px 0 rgba(15,15,16,.22);
}
.ln--ep .star{font-size:17px;line-height:1;color:var(--hot);flex:0 0 auto}
.ln--ep .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.ln--ep .kicker{
  font:700 8px/1 var(--mono);
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--hot);
}
.ln--ep .title{
  font-family:var(--disp);
  font-size:clamp(17px,5vw,22px);
  line-height:.96;
  letter-spacing:-.015em;
  text-transform:uppercase;
}
.ln--ep .arrow{font:700 17px/1 var(--mono);flex:0 0 auto}
.ln--ep:hover,.ln--ep:active{background:#1b1b1f;transform:rotate(-3.1deg) translate(-1px,-2px);box-shadow:7px 8px 0 rgba(15,15,16,.26)}

/* 02 — thin editorial label pushed to the right, rules only */
.ln--lt{
  width:76%;
  margin:20px -2px 0 auto;
  padding:10px 2px 9px;
  justify-content:space-between;
  gap:8px;
  border-top:2.5px solid var(--ink);
  border-bottom:1px solid var(--ink);
  transform:rotate(.9deg);
}
.ln--lt .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.ln--lt b{
  font-family:var(--disp);
  font-size:13.5px;
  line-height:1;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.ln--lt small{font:400 7px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;opacity:.72}
.ln--lt .arrow{font:700 14px/1 var(--mono)}
.ln--lt:hover,.ln--lt:active{background:rgba(255,248,238,.3);transform:rotate(.9deg) translateY(-1px)}

/* 03 — small paper tag dropped to the left, hard outline */
.ln--yt{
  width:60%;
  margin:16px 0 0 5%;
  padding:9px 10px;
  gap:8px;
  background:var(--paper);
  border:1.5px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  transform:rotate(-3.6deg);
}
.ln--yt .play{
  flex:0 0 auto;
  width:18px;height:18px;
  display:grid;place-items:center;
  background:var(--ink);
  color:var(--paper);
  font-size:7px;
  line-height:1;
}
.ln--yt .txt{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.ln--yt b{font-family:var(--disp);font-size:13.5px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.ln--yt small{font:400 6.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;opacity:.66}
.ln--yt .arrow{font:700 12px/1 var(--mono);flex:0 0 auto}
.ln--yt:hover,.ln--yt:active{background:var(--paper2);transform:rotate(-3.6deg) translate(-1px,-2px);box-shadow:5px 5px 0 var(--ink)}

/* 04 — warm paper strip for the mail */
.ln--mail{
  width:97%;
  margin:18px 0 0 1%;
  padding:12px 12px;
  gap:10px;
  background:var(--paper2);
  border:1.5px solid var(--ink);
  transform:rotate(1.8deg);
  box-shadow:-3px 3px 0 rgba(15,15,16,.85);
}
.ln--mail .addr{
  font:700 12px/1.3 var(--mono);
  letter-spacing:0;
  text-decoration:underline;
  text-decoration-thickness:1.5px;
  text-underline-offset:3px;
  flex:0 1 auto;
  min-width:0;
  overflow-wrap:anywhere;
}
.ln--mail .arrow{font:700 13px/1 var(--mono);flex:0 0 auto;margin-left:auto}
.ln--mail:hover,.ln--mail:active{background:#fff;transform:rotate(1.8deg) translate(1px,-1px)}

/* small printed fragments in the gaps */
.frag{
  display:flex;
  align-items:center;
  gap:5px;
  font:400 7.5px/1.3 var(--mono);
  letter-spacing:.2em;
  text-transform:uppercase;
}
.frag svg{width:9px;height:9px;flex:0 0 auto}
.frag--coords{margin:13px 0 0 3px;transform:rotate(-1deg);opacity:.9}
.frag--kr{
  justify-content:flex-end;
  margin:14px 2px 0 0;
  transform:rotate(-2deg);
  opacity:.72;
}

/* ---------- footer ---------- */
.foot{
  position:relative;
  z-index:2;
  display:flex;
  align-items:flex-end;
  gap:10px;
  margin:16px 0 0;
  padding-left:1px;
  transform:rotate(-.9deg);
}
.foot img.barcode{width:100px;height:auto;opacity:.95;filter:contrast(1.15)}
.foot .col{
  font:400 7px/1.5 var(--mono);
  letter-spacing:.16em;
  text-transform:uppercase;
  padding-bottom:1px;
}
.foot .col b{font-size:8.5px;letter-spacing:.1em}
.foot .scan{margin-left:auto;font-size:6.5px;letter-spacing:.2em;opacity:.75;text-align:right;line-height:1.5}

@media (max-width:400px){
  .page{padding:16px 18px 24px}
  .ln--ep .title{font-size:17.5px}
  .ln--mail .addr{font-size:11.5px}
  .shot{width:calc(100% + 12px);margin-left:-8px}
  .topbar{font-size:7px}
}

@media (min-width:640px){
  .page{padding:26px 34px 46px}
  .ln--ep .title{font-size:24px}
  .ln--mail .addr{font-size:14px}
  .topbar{font-size:8.5px}
  .topbar b{font-size:14px}
}

@media (prefers-reduced-motion:reduce){
  .ln{transition:none}
}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<main class="page">

  <header class="topbar">
    <span>NECTA — official<br>artist file</span>

  </header>

  <h1 class="mast">
    <img class="wordmark" src="assets/logos/necta-mag.png?v=10" width="1200" height="487" alt="NECTA">

  <figure class="shot">
    <img src="assets/photos/necta-main-900.jpg?v=10"

         sizes="(max-width: 640px) calc(100vw - 34px), 540px"

    </span>

  <nav class="links" aria-label="NECTA links">

      <span class="arrow" aria-hidden="true">→</span>

    <span class="frag frag--coords" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>
      37.5796° n / 126.9860° e

  <footer class="foot">
    <img class="barcode" src="assets/barcode.svg?v=10" width="200" height="44" alt="">

</main>

</body>
</html>
