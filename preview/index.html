*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0b0b0d}
body{color:#f3f3ef;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}

.page{width:100%;max-width:520px;margin:0 auto;padding:0 22px 44px}

.byline{margin:22px 0 0;font-family:'Archivo';font-weight:300;font-stretch:100%;
  font-size:28px;line-height:1.35;letter-spacing:.09em;text-transform:lowercase;
  color:#c9c9c3}

.loc{margin:7px 0 0;font-family:'Plex';font-size:11px;line-height:1.2;
  letter-spacing:.18em;text-transform:uppercase;color:#75757e}

figure.photo{margin:0 -22px 0 -22px;background:#141417}
figure.photo img{width:100%;height:auto}

.kicker{font-family:'Plex';font-size:10px;line-height:1;letter-spacing:.2em;
  text-transform:uppercase;color:#6a6a73;margin:34px 0 14px}
.kicker:first-of-type{margin-top:32px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);column-gap:12px;row-gap:20px}
.card{display:block}
.thumb{display:block;aspect-ratio:16/9;overflow:hidden;background:#141417}
.thumb img{width:100%;height:100%;object-fit:cover}
.cap{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:8px;font-family:'Archivo';font-weight:600;font-stretch:90%;font-size:11.5px;
  line-height:1.32;letter-spacing:.045em;text-transform:uppercase;word-break:keep-all;
  color:#d8d8d3}
.card:hover .cap,.card:focus-visible .cap{color:#ffffff}

nav{margin-top:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:58px;padding:16px 2px;border-bottom:1px solid #232329}
.row:first-child{border-top:1px solid #232329}
.label{font-family:'Archivo';font-weight:700;font-stretch:87.5%;font-size:14px;
  line-height:1.28;letter-spacing:.05em;text-transform:uppercase;word-break:keep-all}
.label.mail{font-weight:500;font-size:13.5px;letter-spacing:.03em;text-transform:none;color:#d8d8d3}
.arrow{font-family:'Plex';font-size:13px;color:#6a6a73;line-height:1;flex:0 0 auto}
.row:hover .label,.row:focus-visible .label{color:#ffffff}
.row:hover .arrow,.row:focus-visible .arrow{color:#f3f3ef}
:focus-visible{outline:1px solid #8a8a93;outline-offset:3px}
</style>
</head>
