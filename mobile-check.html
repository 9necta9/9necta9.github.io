<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewport check</title>
<style>
  body{margin:0;background:#2a2a2a;display:flex;gap:24px;padding:24px;font-family:system-ui,sans-serif;color:#ddd}
  figure{margin:0}
  figcaption{font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;color:#999}
  iframe{width:390px;height:844px;border:0;background:#000;display:block}
  iframe.small{width:375px;height:667px}
</style>
</head>
<body>
  <figure><figcaption>390 × 844</figcaption><iframe id="a" src="/index.html?check=1"></iframe></figure>
  <figure><figcaption>375 × 667</figcaption><iframe class="small" id="b" src="/index.html?check=1"></iframe></figure>
  <script>
    var q = location.hash ? location.hash : '';
    var v = '?check=' + Date.now();
    document.querySelectorAll('iframe').forEach(function (f) { f.src = '/index.html' + v + q; });
  </script>
</body>
</html>
